<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gym Tracker PPL</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #0f172a; color: #e2e8f0; }
    h1, h2 { margin: 0 0 12px; }
    button { margin: 4px 4px 4px 0; padding: 8px 12px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .card { background: #1e293b; border-radius: 8px; padding: 12px; margin: 12px 0; }
    .exercise { background: #334155; border-radius: 6px; padding: 10px; margin: 8px 0; }
    .set { display: grid; grid-template-columns: 40px 1fr 1fr 1fr auto auto; gap: 6px; align-items: center; margin: 6px 0; }
    input { background: #0f172a; border: 1px solid #475569; color: #e2e8f0; border-radius: 4px; padding: 6px; }
    .timer { font-size: 20px; font-weight: bold; color: #22c55e; }
    .hidden { display: none; }
    .summary { margin-top: 12px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Gym Tracker PPL</h1>

  <div id="home" class="card">
    <h2>Inicio</h2>
    <p id="nextWorkout">Próximo entrenamiento: calculando...</p>
    <button id="startBtn">Comenzar entrenamiento</button>
  </div>

  <div id="routine" class="card hidden">
    <h2 id="routineTitle">Rutina</h2>
    <div id="exercises"></div>
    <div class="summary" id="summary"></div>
    <button id="finishBtn" style="margin-top:12px">Finalizar</button>
    <button id="backBtn" style="margin-top:12px">Volver a Inicio</button>
  </div>

  <div id="timer" class="card hidden">
    <h2>Descanso</h2>
    <div class="timer" id="timerDisplay">00:00</div>
    <button id="stopTimerBtn">Detener</button>
  </div>

  <script>
    const ROUTINES = {
      pushA: {
        title: "Push A",
        exercises: [
          { name: "Press banca plano con barra", sets: 3 },
          { name: "Press inclinado con mancuernas", sets: 3 },
          { name: "Fondos en paralelas", sets: 3 },
          { name: "Elevaciones laterales", sets: 3 },
          { name: "Press francés", sets: 3 },
          { name: "Extensiones de tríceps en polea", sets: 3 }
        ]
      },
      pullA: {
        title: "Pull A",
        exercises: [
          { name: "Dominadas", sets: 3 },
          { name: "Remo con barra", sets: 3 },
          { name: "Remo en polea baja", sets: 3 },
          { name: "Face pull", sets: 3 },
          { name: "Curl de bíceps con barra", sets: 3 },
          { name: "Curl martillo", sets: 3 }
        ]
      },
      legsA: {
        title: "Legs A",
        exercises: [
          { name: "Sentadilla con barra", sets: 3 },
          { name: "Prensa inclinada", sets: 3 },
          { name: "Zancadas con mancuernas", sets: 3 },
          { name: "Extensión de cuádriceps", sets: 3 },
          { name: "Curl femoral tumbado", sets: 3 },
          { name: "Gemelos de pie", sets: 4 }
        ]
      },
      pushB: {
        title: "Push B",
        exercises: [
          { name: "Press militar con barra", sets: 3 },
          { name: "Press banca con mancuernas", sets: 3 },
          { name: "Aperturas en polea o máquina", sets: 3 },
          { name: "Elevaciones frontales", sets: 3 },
          { name: "Press cerrado", sets: 3 },
          { name: "Patada de tríceps", sets: 3 }
        ]
      },
      pullB: {
        title: "Pull B",
        exercises: [
          { name: "Peso muerto", sets: 3 },
          { name: "Jalón al pecho", sets: 3 },
          { name: "Remo con mancuerna", sets: 3 },
          { name: "Pájaros", sets: 3 },
          { name: "Curl predicador", sets: 3 },
          { name: "Curl en polea", sets: 3 }
        ]
      },
      legsB: {
        title: "Legs B",
        exercises: [
          { name: "Peso muerto rumano", sets: 3 },
          { name: "Hip thrust", sets: 3 },
          { name: "Sentadilla búlgara", sets: 3 },
          { name: "Curl femoral sentado", sets: 3 },
          { name: "Gemelos sentado", sets: 4 },
          { name: "Abductores en máquina", sets: 3 }
        ]
      }
    };

    const ORDER = ["pushA","pullA","legsA","pushB","pullB","legsB"];
    let currentRoutine = null;
    let timerInterval = null;

    function loadState() {
      const last = localStorage.getItem("lastRoutine");
      const today = localStorage.getItem("todayDate");
      const now = new Date().toDateString();
      if (today !== now) {
        let idx = last ? ORDER.indexOf(last) : -1;
        idx = (idx + 1) % ORDER.length;
        localStorage.setItem("todayDate", now);
        localStorage.setItem("nextRoutine", ORDER[idx]);
      }
      return localStorage.getItem("nextRoutine") || "pushA";
    }

    function saveRoutine(key, data) {
      localStorage.setItem("routine_"+key, JSON.stringify(data));
    }

    function loadRoutine(key) {
      const d = localStorage.getItem("routine_"+key);
      return d ? JSON.parse(d) : null;
    }

    function renderExercises(routineKey) {
      const r = ROUTINES[routineKey];
      let html = "";
      const saved = loadRoutine(routineKey) || {exercises: r.exercises.map(e => ({name:e.name, sets:e.sets.map(()=>({weight:"",reps:"",rir:"",checked:false,resting:false}))}))};
      saved.exercises.forEach((ex,ei) => {
        html += `<div class="exercise"><strong>${ex.name}</strong>`;
        ex.sets.forEach((s,si) => {
          const chk = s.checked ? "checked" : "";
          html += `<div class="set">
            <span>#${si+1}</span>
            <input type="number" placeholder="kg" value="${s.weight||""}" onchange="updateSet('${routineKey}',${ei},${si},'weight',this.value)">
            <input type="number" placeholder="reps" value="${s.reps||""}" onchange="updateSet('${routineKey}',${ei},${si},'reps',this.value)">
            <input type="number" placeholder="RIR" value="${s.rir||""}" onchange="updateSet('${routineKey}',${ei},${si},'rir',this.value)">
            <button onclick="toggleCheck('${routineKey}',${ei},${si})" ${chk}>✓</button>
            <button onclick="startRest('${routineKey}',${ei},${si})" ${s.resting?"disabled":""}>⏱</button>
          </div>`;
        });
        html += `</div>`;
      });
      document.getElementById("exercises").innerHTML = html;
      updateSummary(routineKey);
    }

    function updateSet(rk,ei,si,fld,val) {
      const d = loadRoutine(rk);
      d.exercises[ei].sets[si][fld] = fld==="checked"||fld==="resting" ? !!val : val;
      saveRoutine(rk,d);
      if(fld==="checked"||fld==="resting") renderExercises(rk);
      updateSummary(rk);
    }

    function toggleCheck(rk,ei,si) {
      const d = loadRoutine(rk);
      d.exercises[ei].sets[si].checked = !d.exercises[ei].sets[si].checked;
      saveRoutine(rk,d);
      renderExercises(rk);
    }

    function startRest(rk,ei,si) {
      const d = loadRoutine(rk);
      d.exercises[ei].sets[si].resting = true;
      saveRoutine(rk,d);
      renderExercises(rk);
      document.getElementById("timer").classList.remove("hidden");
      let t = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(()=>{
        t++;
        const m = String(Math.floor(t/60)).padStart(2,"0");
        const s = String(t%60).padStart(2,"0");
        document.getElementById("timerDisplay").textContent = `${m}:${s}`;
      },1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      document.getElementById("timer").classList.add("hidden");
      document.getElementById("timerDisplay").textContent = "00:00";
      if(currentRoutine){
        const d = loadRoutine(currentRoutine);
        d.exercises.forEach(ex=>ex.sets.forEach(s=>s.resting=false));
        saveRoutine(currentRoutine,d);
        renderExercises(currentRoutine);
      }
    }

    function updateSummary(rk) {
      const d = loadRoutine(rk);
      let total=0,done=0,w=0;
      d.exercises.forEach(ex=>ex.sets.forEach(s=>{
        total++;
        if(s.checked){done++; if(s.weight) w+=parseFloat(s.weight)||0;}
      }));
      const vol = done ? (w/1000).toFixed(1)+" t" : "-";
      document.getElementById("summary").textContent = `Series: ${done}/${total} | Volumen: ${vol}`;
    }

    document.getElementById("startBtn").onclick = ()=>{
      const rk = loadState();
      currentRoutine = rk;
      document.getElementById("home").classList.add("hidden");
      document.getElementById("routine").classList.remove("hidden");
      document.getElementById("routineTitle").textContent = ROUTINES[rk].title;
      renderExercises(rk);
    };

    document.getElementById("finishBtn").onclick = ()=>{
      if(currentRoutine){
        const idx = ORDER.indexOf(currentRoutine);
        const next = ORDER[(idx+1)%ORDER.length];
        localStorage.setItem("nextRoutine",next);
        localStorage.setItem("lastRoutine",currentRoutine);
      }
      currentRoutine = null;
      document.getElementById("routine").classList.add("hidden");
      document.getElementById("home").classList.remove("hidden");
      const nxt = loadState();
      document.getElementById("nextWorkout").textContent = "Próximo entrenamiento: " + ROUTINES[nxt].title;
    };

    document.getElementById("backBtn").onclick = ()=>{
      currentRoutine = null;
      document.getElementById("routine").classList.add("hidden");
      document.getElementById("home").classList.remove("hidden");
      const nxt = loadState();
      document.getElementById("nextWorkout").textContent = "Próximo entrenamiento: " + ROUTINES[nxt].title;
    };

    document.getElementById("stopTimerBtn").onclick = stopTimer;

    // init
    const nxt = loadState();
    document.getElementById("nextWorkout").textContent = "Próximo entrenamiento: " + ROUTINES[nxt].title;
  </script>
</body>
</html>
