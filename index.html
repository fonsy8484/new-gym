<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mi Entrenamiento</title>
  <style>
    :root {
      --bg: #080607;
      --surface: #151012;
      --surface-2: #1d1215;
      --line: rgba(255,255,255,.10);
      --text: #fff8f7;
      --muted: #b8a7aa;
      --red: #ee2929;
      --red-deep: #941313;
      --red-soft: #3c1217;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 480px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px calc(108px + env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand {
      margin: 0;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .13em;
      color: #fff;
    }

    .profile {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #1a1113;
      font-weight: 800;
    }

    .hero {
      position: relative;
      min-height: 318px;
      overflow: hidden;
      border: 1px solid rgba(255, 70, 70, .26);
      border-radius: 28px;
      background:
        radial-gradient(circle at 74% 24%, rgba(255, 63, 35, .75) 0 2%, transparent 18%),
        radial-gradient(circle at 74% 8%, rgba(232, 26, 26, .28), transparent 34%),
        linear-gradient(135deg, rgba(0,0,0,.2), rgba(0,0,0,.82)),
        linear-gradient(145deg, #2a0909 0%, #11090a 55%, #060607 100%);
      box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 -90px 100px rgba(0,0,0,.75);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 208px;
      height: 258px;
      right: 20px;
      top: 24px;
      border-radius: 48% 48% 35% 35%;
      background:
        radial-gradient(ellipse at 54% 18%, #d98b6c 0 8%, transparent 9%),
        radial-gradient(ellipse at 48% 36%, #a53a28 0 18%, transparent 19%),
        radial-gradient(ellipse at 32% 49%, #742018 0 18%, transparent 19%),
        radial-gradient(ellipse at 67% 50%, #6e1c16 0 18%, transparent 19%),
        linear-gradient(90deg, transparent 0 17%, rgba(0,0,0,.78) 18% 25%, transparent 26% 72%, rgba(0,0,0,.77) 73% 80%, transparent 81%),
        linear-gradient(180deg, #2b0c0b 0%, #7a2119 42%, #13090a 100%);
      filter: contrast(1.35) saturate(1.25);
      transform: rotate(-6deg);
      opacity: .95;
      box-shadow: -22px 12px 55px rgba(0,0,0,.78);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(109deg, transparent 0 57%, rgba(245,40,30,.9) 57.4% 58.3%, transparent 58.7%),
        linear-gradient(165deg, rgba(255,255,255,.06), transparent 34%),
        linear-gradient(0deg, rgba(0,0,0,.92), transparent 55%);
      pointer-events: none;
    }

    .hero-content {
      position: absolute;
      z-index: 1;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #ff817a;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .16em;
    }

    .hero-title {
      max-width: 280px;
      margin: 0;
      font-size: clamp(29px, 8vw, 39px);
      line-height: .96;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .quote {
      min-height: 52px;
      margin: 22px 2px 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
    }

    .start {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 17px;
      background: linear-gradient(135deg, #ff4540, #ba1014);
      color: #fff;
      box-shadow: 0 12px 26px rgba(215, 18, 20, .26), inset 0 1px rgba(255,255,255,.28);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .055em;
      cursor: pointer;
    }

    .start:active { transform: scale(.985); }

    .section-label {
      margin: 31px 0 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .today-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      min-height: 142px;
      padding: 19px;
      border: 1px solid rgba(255, 79, 71, .25);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(91, 17, 20, .86), rgba(26, 15, 17, .98) 65%);
      box-shadow: inset 4px 0 var(--red), 0 16px 32px rgba(0,0,0,.23);
      cursor: pointer;
    }

    .today-status {
      margin: 0 0 9px;
      color: #ff7770;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .today-card h2 {
      margin: 0;
      font-size: 27px;
      line-height: 1;
      letter-spacing: -.04em;
    }

    .today-card p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .today-meta {
      margin-top: 15px !important;
      color: #f6d6d6 !important;
      font-size: 12px !important;
      font-weight: 700;
    }

    .arrow {
      align-self: center;
      width: 41px;
      height: 41px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%;
      background: rgba(0,0,0,.25);
      color: #fff;
      font-size: 23px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(8,6,7,.99), rgba(8,6,7,.87));
      backdrop-filter: blur(12px);
    }

    .bottom-nav-inner {
      width: min(100%, 460px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #151012;
      overflow: hidden;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #998b8e;
      padding: 13px 4px;
      font-size: 11px;
      font-weight: 800;
    }

    .nav-item.active {
      color: #fff;
      background: linear-gradient(180deg, #431317, #291113);
      box-shadow: inset 0 2px var(--red);
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <p class="brand">MI ENTRENAMIENTO</p>
      <div class="profile" aria-label="Perfil">F</div>
    </header>

    <section class="hero" aria-label="Motivación de entrenamiento">
      <div class="hero-content">
        <p class="eyebrow">ENTRENA SIN EXCUSAS</p>
        <h1 class="hero-title" id="motivational-title">Hoy no hay excusas.</h1>
      </div>
    </section>

    <p class="quote" id="motivational-quote">La disciplina empieza cuando termina la motivación.</p>

    <button class="start" id="start-workout">EMPEZAR ENTRENAMIENTO</button>

    <p class="section-label">ENTRENAMIENTO DE HOY</p>

    <article class="today-card" id="today-workout" role="button" tabindex="0">
      <div>
        <p class="today-status">HOY · LISTO PARA EMPEZAR</p>
        <h2>PULL A</h2>
        <p>Espalda, bíceps y antebrazo</p>
        <p class="today-meta">8 ejercicios · ~60 min</p>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
    </article>
  </main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <div class="bottom-nav-inner">
      <button class="nav-item active">Inicio</button>
      <button class="nav-item">Rutina</button>
      <button class="nav-item">Progreso</button>
      <button class="nav-item">Perfil</button>
    </div>
  </nav>

  <script>
    const messages = [
      ['HOY NO HAY EXCUSAS.', 'La disciplina empieza cuando termina la motivación.'],
      ['HAZ QUE CUENTE.', 'No necesitas sentirte preparado. Necesitas empezar.'],
      ['LA DISCIPLINA GANA.', 'Cada serie es un paso hacia tu mejor versión.'],
      ['MÁS FUERTE QUE AYER.', 'El esfuerzo de hoy es el resultado de mañana.'],
      ['ENTRENA. SUPERA. REPITE.', 'No negocies contigo mismo cuando toca entrenar.']
    ];

    const selected = messages[Math.floor(Math.random() * messages.length)];
    document.querySelector('#motivational-title').textContent = selected[0];
    document.querySelector('#motivational-quote').textContent = selected[1];

    function previewWorkout() {
      alert('La pantalla de entrenamiento será el siguiente paso. Primero vamos a terminar y aprobar esta página de Inicio.');
    }

    document.querySelector('#start-workout').addEventListener('click', previewWorkout);
    document.querySelector('#today-workout').addEventListener('click', previewWorkout);
    document.querySelector('#today-workout').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') previewWorkout();
    });
  </script>
</body>
</html>
