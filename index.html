<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Gym App</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
    .app{background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;overflow:hidden}
    .screen{display:none;padding:30px}
    .screen.active{display:block}
    h1{font-size:28px;color:#333;margin-bottom:10px;text-align:center}
    h2{font-size:20px;color:#555;margin-bottom:20px;text-align:center}
    .subtitle{color:#888;text-align:center;margin-bottom:30px;font-size:14px}
    .routine-card{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;border-radius:15px;margin-bottom:15px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
    .routine-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(102,126,234,0.4)}
    .routine-card h3{font-size:18px;margin-bottom:5px}
    .routine-card p{font-size:13px;opacity:0.9}
    .routine-card .meta{font-size:12px;opacity:0.8;margin-top:8px}
    .btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:15px 30px;border-radius:10px;font-size:16px;cursor:pointer;width:100%;margin-top:20px;transition:transform 0.2s,box-shadow 0.2s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(102,126,234,0.4)}
    .btn:active{transform:translateY(0)}
    .btn-secondary{background:#f0f0f0;color:#333}
    .exercise-display{text-align:center;margin:30px 0}
    .exercise-name{font-size:24px;color:#333;margin-bottom:10px}
    .exercise-detail{font-size:16px;color:#666;margin-bottom:15px}
    .exercise-tip{background:#f8f9fa;padding:15px;border-radius:10px;font-size:14px;color:#555;border-left:4px solid #667eea}
    .progress-dots{display:flex;justify-content:center;gap:8px;margin:20px 0}
    .dot{width:10px;height:10px;border-radius:50%;background:#ddd;transition:background 0.3s}
    .dot.active{background:#667eea}
    .counter{font-size:48px;color:#667eea;text-align:center;margin:20px 0;font-weight:bold}
    .history-list{max-height:300px;overflow-y:auto}
    .history-item{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:10px}
    .history-item h4{color:#333;font-size:16px;margin-bottom:5px}
    .history-item p{color:#666;font-size:13px}
    .back-btn{background:transparent;color:#667eea;border:2px solid #667eea;padding:10px 20px;border-radius:8px;cursor:pointer;margin-bottom:20px;font-size:14px}
    .back-btn:hover{background:#667eea;color:white}
    .complete-message{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px;border-radius:15px;text-align:center;margin:20px 0}
    .complete-message h3{font-size:22px;margin-bottom:10px}
    .complete-message p{font-size:14px;opacity:0.9}
  </style>
</head>
<body>
  <div class="app">
    <!-- Home Screen -->
    <div id="home" class="screen active">
      <h1>New Gym App</h1>
      <p class="subtitle">Selecciona tu rutina de hoy</p>
      <div id="routines-list"></div>
    </div>

    <!-- Workout Screen -->
    <div id="workout" class="screen">
      <button class="back-btn" onclick="showScreen('home')">← Volver</button>
      <h2 id="routine-title">Rutina</h2>
      <div class="exercise-display">
        <div id="exercise-name" class="exercise-name">Press de banca</div>
        <div id="exercise-detail" class="exercise-detail">Pecho · 3 series · 8–12 reps</div>
        <div id="exercise-tip" class="exercise-tip">Mantén las escápulas atrás, baja de forma controlada y empuja sin rebotar.</div>
      </div>
      <div class="progress-dots" id="progress-dots"></div>
      <button class="btn" id="start-btn" onclick="startExercise()">Comenzar ejercicio</button>
      <button class="btn" id="rest-btn" onclick="startRest()" style="display:none">Descansar</button>
      <div id="counter" class="counter" style="display:none">30</div>
      <button class="btn btn-secondary" id="next-btn" onclick="nextExercise()" style="display:none">Siguiente ejercicio</button>
    </div>

    <!-- Complete Screen -->
    <div id="complete" class="screen">
      <button class="back-btn" onclick="showScreen('home')">← Volver</button>
      <div class="complete-message">
        <h3>¡Rutina completada! 🎉</h3>
        <p>Has terminado todos los ejercicios. ¡Buen trabajo!</p>
      </div>
      <button class="btn" onclick="showScreen('home')">Volver al inicio</button>
    </div>

    <!-- History Screen -->
    <div id="history" class="screen">
      <button class="back-btn" onclick="showScreen('home')">← Volver</button>
      <h2>Historial</h2>
      <div id="history-list" class="history-list"></div>
      <button class="btn btn-secondary" onclick="clearHistory()">Borrar historial</button>
    </div>
  </div>

  <script>
    // === DATOS DE LAS SEIS RUTINAS ===
    const routines = [
      {
        id: 'push-a',
        name: 'PUSH A',
        muscles: 'Pecho, hombro y tríceps',
        meta: '6 ejercicios · ~55 min',
        exercises: [
          { name: 'Press de banca con barra', detail: 'Pecho · 3 series · 8–12 reps', tip: 'Mantén las escápulas atrás, baja de forma controlada y empuja sin rebotar.' },
          { name: 'Press inclinado con mancuernas', detail: 'Pectoral superior · 3 series · 8–12 reps', tip: 'Usa un banco inclinado moderado y controla el descenso.' },
          { name: 'Aperturas en polea o máquina', detail: 'Aislamiento pecho · 3 series · 12–15 reps', tip: 'Mantén los codos semiflexionados y siente el estiramiento.' },
          { name: 'Press militar con barra o mancuernas', detail: 'Hombro · 3 series · 8–12 reps', tip: 'Core apretado, evita arquear la espalda.' },
          { name: 'Elevaciones laterales', detail: 'Hombro lateral · 3 series · 12–15 reps', tip: 'Movimiento controlado, no uses impulso.' },
          { name: 'Extensiones de tríceps en polea', detail: 'Tríceps · 3 series · 10–15 reps', tip: 'Codos pegados al cuerpo, solo se mueve el antebrazo.' }
        ]
      },
      {
        id: 'pull-a',
        name: 'PULL A',
        muscles: 'Espalda, bíceps y antebrazo',
        meta: '8 ejercicios · ~60 min',
        exercises: [
          { name: 'Jalón al pecho con agarre prono', detail: 'Dorsal ancho · 3 series · 8–12 reps', tip: 'Lleva la barra al pecho, no detrás del cuello.' },
          { name: 'Remo con barra', detail: 'Espalda media · 3 series · 8–12 reps', tip: 'Espalda recta, lleva la barra al ombligo.' },
          { name: 'Remo en polea baja', detail: 'Espalda media · 3 series · 10–12 reps', tip: 'Aprieta las escápulas al final del movimiento.' },
          { name: 'Face Pull', detail: 'Hombro posterior · 3 series · 12–15 reps', tip: 'Lleva la cuerda hacia la cara, codos altos.' },
          { name: 'Curl de bíceps con barra', detail: 'Bíceps · 3 series · 8–12 reps', tip: 'Sin impulso, controla la bajada.' },
          { name: 'Curl martillo con mancuernas', detail: 'Bíceps y braquial · 3 series · 10–12 reps', tip: 'Mantén los codos fijos a los lados.' },
          { name: 'Curl de muñeca con barra (pronación)', detail: 'Antebrazo · 3 series · 12–15 reps', tip: 'Solo se mueve la muñeca, antebrazos apoyados.' },
          { name: 'Curl de muñeca inverso (supinación)', detail: 'Antebrazo · 3 series · 12–15 reps', tip: 'Movimiento lento y controlado.' }
        ]
      },
      {
        id: 'legs-a',
        name: 'LEGS A',
        muscles: 'Cuádriceps, femoral y gemelos',
        meta: '6 ejercicios · ~60 min',
        exercises: [
          { name: 'Sentadilla con barra', detail: 'Cuádriceps y glúteos · 4 series · 6–10 reps', tip: 'Espalda recta, baja hasta que los cuádriceps estén paralelos al suelo.' },
          { name: 'Zancadas con mancuernas', detail: 'Cuádriceps y glúteos · 3 series · 10–12 reps por pierna', tip: 'Da un paso largo y baja la rodilla trasera casi hasta el suelo.' },
          { name: 'Peso muerto rumano', detail: 'Femoral y glúteos · 3 series · 8–12 reps', tip: 'Mantén la barra cerca de las piernas, siente el estiramiento en los femorales.' },
          { name: 'Curl femoral acostado o sentado', detail: 'Femoral · 3 series · 10–15 reps', tip: 'Contrae fuerte al subir, controla la bajada.' },
          { name: 'Gemelos de pie en máquina', detail: 'Gemelos · 4 series · 12–20 reps', tip: 'Sube todo lo posible y baja lento hasta estirar bien.' },
          { name: 'Plancha abdominal', detail: 'Core · 3 series · 30–60 segundos', tip: 'Cuerpo recto, aprieta abdomen y glúteos.' }
        ]
      },
      {
        id: 'push-b',
        name: 'PUSH B',
        muscles: 'Hombro, pecho y tríceps',
        meta: '5 ejercicios · ~50 min',
        exercises: [
          { name: 'Press militar con barra', detail: 'Hombro · 4 series · 6–10 reps', tip: 'De pie o sentado, core apretado, barra hasta arriba de la cabeza.' },
          { name: 'Press plano con mancuernas', detail: 'Pecho · 3 series · 8–12 reps', tip: 'Baja hasta sentir buen estiramiento, sin dolor de hombro.' },
          { name: 'Fondos en paralelas o press cerrado', detail: 'Pecho inferior y tríceps · 3 series · 8–12 reps', tip: 'Cuerpo ligeramente inclinado para enfatizar pecho.' },
          { name: 'Elevaciones laterales', detail: 'Hombro lateral · 3 series · 12–15 reps', tip: 'Peso moderado, prioriza la técnica.' },
          { name: 'Extensiones de tríceps tras nuca', detail: 'Tríceps · 3 series · 10–15 reps', tip: 'Solo se mueve el antebrazo, codo fijo.' }
        ]
      },
      {
        id: 'pull-b',
        name: 'PULL B',
        muscles: 'Espalda, bíceps y antebrazo',
        meta: '6 ejercicios · ~55 min',
        exercises: [
          { name: 'Jalón al pecho con agarre supino', detail: 'Dorsal · 3 series · 8–12 reps', tip: 'Agarre más cerrado, lleva la barra al pecho.' },
          { name: 'Remo con mancuerna a una mano', detail: 'Espalda media · 3 series · 8–12 reps por lado', tip: 'Apoya la mano en el banco, tira hacia la cadera.' },
          { name: 'Encogimientos con barra o mancuernas', detail: 'Trapecios · 3 series · 12–15 reps', tip: 'Sube los hombros hacia las orejas, baja lento.' },
          { name: 'Curl concentrado', detail: 'Bíceps (pico) · 3 series · 10–12 reps', tip: 'Codo apoyado en el muslo, sube lento y controla.' },
          { name: 'Curl martillo', detail: 'Bíceps y braquial · 3 series · 10–12 reps', tip: 'Igual que en Pull A, pero puedes variar el peso.' },
          { name: 'Curl de muñeca con barra', detail: 'Antebrazo · 3 series · 12–15 reps', tip: 'Puedes hacer solo pronación o alternar con supinación.' }
        ]
      },
      {
        id: 'legs-b',
        name: 'LEGS B',
        muscles: 'Glúteos, femoral y cuádriceps',
        meta: '6 ejercicios · ~60 min',
        exercises: [
          { name: 'Hip Thrust (empuje de cadera)', detail: 'Glúteos · 4 series · 8–12 reps', tip: 'Espalda apoyada en banco, sube la cadera hasta alinear con el torso.' },
          { name: 'Sentadilla búlgara', detail: 'Cuádriceps y glúteos · 3 series · 8–12 reps por pierna', tip: 'Pie trasero elevado, baja recto sin inclinar el torso.' },
          { name: 'Peso muerto rumano', detail: 'Femoral y glúteos · 3 series · 8–12 reps', tip: 'Como en Legs A, puedes usar barra o mancuernas.' },
          { name: 'Curl femoral', detail: 'Femoral · 3 series · 10–15 reps', tip: 'Puedes alternar entre acostado y sentado.' },
          { name: 'Gemelo sentado en máquina', detail: 'Sóleo (gemelo) · 4 series · 15–20 reps', tip: 'Rodillas a 90°, sube y baja con recorrido completo.' },
          { name: 'Elevación de piernas colgado o tumbado', detail: 'Abdomen inferior · 3 series · 10–20 reps', tip: 'Controla el movimiento, evita impulsos.' }
        ]
      }
    ];

    // === ESTADO DE LA APP ===
    let activeRoutineId = localStorage.getItem('newGymActiveRoutine') || 'pull-a';
    let currentExercise = 0;
    let state = { sets: [], restTime: 30 };
    let timer = null;
    let timeLeft = 30;

    function activeRoutine() {
      return routines.find(r => r.id === activeRoutineId);
    }

    function storageKey() {
      return `newGymState-${activeRoutineId}`;
    }

    function historyKey() {
      return 'newGymSessionHistory';
    }

    function loadState() {
      return JSON.parse(localStorage.getItem(storageKey()) || '{}');
    }

    function saveState() {
      localStorage.setItem(storageKey(), JSON.stringify(state));
    }

    function loadHistory() {
      return JSON.parse(localStorage.getItem(historyKey()) || '[]');
    }

    function saveHistory(history) {
      localStorage.setItem(historyKey(), JSON.stringify(history));
    }

    // === NAVEGACIÓN ===
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (screenId === 'home') renderHome();
      if (screenId === 'history') renderHistory();
    }

    function renderHome() {
      const container = document.getElementById('routines-list');
      container.innerHTML = routines.map(routine => `
        <div class="routine-card" data-routine="${routine.id}">
          <h3>${routine.name}</h3>
          <p>${routine.muscles}</p>
          <div class="meta">${routine.meta}</div>
        </div>
      `).join('');

      container.querySelectorAll('.routine-card').forEach(card => {
        card.addEventListener('click', () => {
          activeRoutineId = card.dataset.routine;
          localStorage.setItem('newGymActiveRoutine', activeRoutineId);
          currentExercise = 0;
          state = loadState();
          showScreen('workout');
        });
      });
    }

    function renderWorkout() {
      const routine = activeRoutine();
      document.getElementById('routine-title').textContent = routine.name;
      
      const exercise = routine.exercises[currentExercise];
      document.getElementById('exercise-name').textContent = exercise.name;
      document.getElementById('exercise-detail').textContent = exercise.detail;
      document.getElementById('exercise-tip').textContent = exercise.tip;

      const dots = document.getElementById('progress-dots');
      dots.innerHTML = routine.exercises.map((_, i) => 
        `<div class="dot ${i === currentExercise ? 'active' : ''}"></div>`
      ).join('');

      document.getElementById('start-btn').style.display = 'block';
      document.getElementById('rest-btn').style.display = 'none';
      document.getElementById('counter').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
    }

    function renderHistory() {
      const history = loadHistory();
      const container = document.getElementById('history-list');
      if (history.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#888;">No hay sesiones registradas</p>';
        return;
      }
      container.innerHTML = history.slice().reverse().map(session => `
        <div class="history-item">
          <h4>${session.routine} · ${new Date(session.date).toLocaleDateString()}</h4>
          <p>${session.exercises} ejercicios · ${session.duration}</p>
        </div>
      `).join('');
    }

    // === LÓGICA DEL ENTRENAMIENTO ===
    function startExercise() {
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('rest-btn').style.display = 'block';
    }

    function startRest() {
      document.getElementById('rest-btn').style.display = 'none';
      document.getElementById('counter').style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
      
      timeLeft = state.restTime || 30;
      document.getElementById('counter').textContent = timeLeft;
      
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('counter').textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
        }
      }, 1000);
    }

    function nextExercise() {
      clearInterval(timer);
      const routine = activeRoutine();
      
      // Guardar estado
      if (!state.sets) state.sets = [];
      state.sets[currentExercise] = (state.sets[currentExercise] || 0) + 1;
      saveState();

      currentExercise++;
      if (currentExercise >= routine.exercises.length) {
        // Rutina completada
        const history = loadHistory();
        history.push({
          routine: routine.name,
          date: new Date().toISOString(),
          exercises: routine.exercises.length,
          duration: '~' + Math.round(routine.exercises.length * 7) + ' min'
        });
        saveHistory(history);
        showScreen('complete');
      } else {
        renderWorkout();
      }
    }

    function clearHistory() {
      if (confirm('¿Borrar todo el historial?')) {
        saveHistory([]);
        renderHistory();
      }
    }

    // === INICIALIZACIÓN ===
    renderHome();
  </script>
</body>
</html>
