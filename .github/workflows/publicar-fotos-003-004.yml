name: Publicar fotos 003 y 004
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-003-004.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='655fec1ff33e115cb808b431be055c257a8d515c00280fe5259708409021085a'
          paths=[Path('imagenes/003.jpg'),Path('imagenes/004.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob in zip(paths,[raw[:4497],raw[4497:]]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==(688,384)
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/003.jpg imagenes/004.jpg
          git commit -m 'Añadir fotos de ejercicios 3 y 4'
          git push origin HEAD:main
