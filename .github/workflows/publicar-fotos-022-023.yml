name: Publicar fotos 022 y 023
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-022-023.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0a0c0b9b31b6b94b5cde8d3fc4fde27fcdc6a7fec211e50c719325acb0d69046'
          paths=[Path('imagenes/022.jpg'),Path('imagenes/023.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob in zip(paths,[raw[:4507],raw[4507:]]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==(688,384)
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/022.jpg imagenes/023.jpg
          git commit -m 'Añadir fotos de ejercicios 22 y 23'
          git push origin HEAD:main
