name: Publicar fotos 011 y 012
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-011-012.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='a20bc0f24c55082b2778aae698d08fb9e0355e3d7e2f64776f10f40d94968307'
          paths=[Path('imagenes/011.jpg'),Path('imagenes/012.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob in zip(paths,[raw[:4453],raw[4453:]]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==(688,384)
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/011.jpg imagenes/012.jpg
          git commit -m 'Añadir fotos de ejercicios 11 y 12'
          git push origin HEAD:main
