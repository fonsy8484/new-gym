name: Publicar fotos 005 y 006
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-005-006.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='4ff7177b9bc6e370d132e64319ad2190f460b027447eb4f342df7cf300118531'
          paths=[Path('imagenes/005.jpg'),Path('imagenes/006.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob in zip(paths,[raw[:4757],raw[4757:]]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==(600,448)
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/005.jpg imagenes/006.jpg
          git commit -m 'Añadir fotos de ejercicios 5 y 6'
          git push origin HEAD:main
