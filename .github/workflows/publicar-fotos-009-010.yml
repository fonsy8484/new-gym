name: Publicar fotos 009 y 010
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-009-010.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='188afa0ddd6f11d5f1dafd648fccd66061bdac54c67578333ad30588d6f1157b'
          paths=[Path('imagenes/009.jpg'),Path('imagenes/010.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob in zip(paths,[raw[:4842],raw[4842:]]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==(688,384)
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/009.jpg imagenes/010.jpg
          git commit -m 'Añadir fotos de ejercicios 9 y 10'
          git push origin HEAD:main
