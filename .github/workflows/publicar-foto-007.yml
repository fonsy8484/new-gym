name: Publicar foto 007
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-foto-007.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='5681658bb8bebe08a42084f995e986b5a76ff929e1281793e2e6cf1548e0b883'
          path=Path('imagenes/007.jpg')
          assert not path.exists()
          image=Image.open(BytesIO(raw)).convert('RGB')
          assert image.size==(600,448)
          path.parent.mkdir(exist_ok=True)
          image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/007.jpg
          git commit -m 'Añadir foto de ejercicio 7'
          git push origin HEAD:main
