name: Publicar fotos 020 y 021
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-020-021.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='7e5edd21dc34bc8120302d51606b3ae26823994c811c68a590adf323f74fd23b'
          paths=[Path('imagenes/020.jpg'),Path('imagenes/021.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob,size in zip(paths,[raw[:5249],raw[5249:]],[(632,424),(688,384)]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==size
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/020.jpg imagenes/021.jpg
          git commit -m 'Añadir fotos de ejercicios 20 y 21'
          git push origin HEAD:main
