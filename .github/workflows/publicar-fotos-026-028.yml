name: Publicar fotos 026 y 028
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-026-028.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='9ba1b30eb6bd52aa68da618a587ef8d311f6c37141ff38748fd23fcc0ff51661'
          paths=[Path('imagenes/026.jpg'),Path('imagenes/028.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob in zip(paths,[raw[:3796],raw[3796:]]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==(632,424)
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/026.jpg imagenes/028.jpg
          git commit -m 'Añadir fotos de ejercicios 26 y 28'
          git push origin HEAD:main
