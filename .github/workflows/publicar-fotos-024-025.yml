name: Publicar fotos 024 y 025
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-024-025.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='17c251aa07d1bb903cad99a2c321bd37152c09c9540ffa6d5d348ec39cd7cd9b'
          paths=[Path('imagenes/024.jpg'),Path('imagenes/025.jpg')]
          assert not any(p.exists() for p in paths)
          Path('imagenes').mkdir(exist_ok=True)
          for path,blob,size in zip(paths,[raw[:4669],raw[4669:]],[(688,384),(632,424)]):
              image=Image.open(BytesIO(blob)).convert('RGB')
              assert image.size==size
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/024.jpg imagenes/025.jpg
          git commit -m 'Añadir fotos de ejercicios 24 y 25'
          git push origin HEAD:main
