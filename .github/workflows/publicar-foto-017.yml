name: Publicar foto 017
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-foto-017.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='d10d16afc3e4754202e315a64a778cbc506365518223374f9b97886b0ae64ec0'
          path=Path('imagenes/017.jpg')
          assert not path.exists()
          image=Image.open(BytesIO(raw)).convert('RGB')
          assert image.size==(632,424)
          path.parent.mkdir(exist_ok=True)
          image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/017.jpg
          git commit -m 'Añadir foto de ejercicio 17'
          git push origin HEAD:main
