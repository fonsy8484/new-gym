name: Publicar fotos 001 y 002
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-fotos-001-002.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear y publicar las dos fotos revisadas
        run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64,hashlib
          payload={'001.jpg': '', '002.jpg': ''}
          checks={'001.jpg': '9f05a59ccfcf03324c3393d685746957c89ceb21ddb17e9dca6ad9225a62328e', '002.jpg': '9cc3e6fdd5095880cc5dd6cd73ae81dcc46bd6c9610eab6b2de7f65b70332b74'}
          images=[]
          for name,text in payload.items():
              raw=base64.b64decode(text,validate=True)
              assert hashlib.sha256(raw).hexdigest()==checks[name], 'Datos de imagen no válidos'
              image=Image.open(BytesIO(raw)).convert('RGB')
              assert image.size==(688,384), 'Dimensiones no válidas'
              images.append((Path('imagenes')/name,image))
          assert not any(p.exists() for p,_ in images), 'No se sobrescriben fotos existentes'
          Path('imagenes').mkdir(exist_ok=True)
          for path,image in images:
              image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/001.jpg imagenes/002.jpg
          git commit -m 'Añadir fotos de ejercicios 1 y 2'
          git push origin HEAD:main
