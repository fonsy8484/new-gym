name: Publicar foto 019
on:
  push:
    branches: [main]
    paths: [.github/workflows/publicar-foto-019.yml]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --upgrade Pillow
          python - <<'PY'
          import base64,hashlib
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          encoded=''
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='be4c50712a365d253ed4a20159717529109a954f16898f9a6e4472b42cd88c57'
          path=Path('imagenes/019.jpg')
          assert not path.exists()
          image=Image.open(BytesIO(raw)).convert('RGB')
          assert image.size==(632,424)
          path.parent.mkdir(exist_ok=True)
          image.save(path,format='JPEG',quality=90,optimize=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagenes/019.jpg
          git commit -m 'Añadir foto de ejercicio 19'
          git push origin HEAD:main
